version: 2

sources:
  - name: mining
    description: "Indonesian mining, global commodity, and macroeconomic market data"
    database: mining_market
    schema: public
    tables:
      - name: stock_prices
        description: "Historical daily stock prices from Yahoo Finance"

      - name: commodity_prices
        description: "Historical commodity futures prices from Yahoo Finance"

      - name: world_bank_commodity_prices
        description: "Historical monthly Nickel and Australian Coal prices from World Bank Pink Sheet"

      - name: jisdor_rates
        description: "Daily USD/IDR JISDOR exchange rates published by Bank Indonesia"

      - name: bi_policy_rates
        description: "Historical BI-Rate policy decisions published by Bank Indonesia"
